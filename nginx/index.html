<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#edf2ff;min-height:100vh;padding:48px 20px}
main{max-width:720px;margin:auto}.tag{color:#8b9cff;font-size:12px;letter-spacing:3px;text-transform:uppercase}
h1{font-size:42px;margin:12px 0}p{color:#9ca9c5}.panel{background:#141c31;border:1px solid #293451;border-radius:18px;padding:22px;margin-top:26px}
form{display:flex;gap:10px}input{min-width:0;flex:1;background:#0c1325;border:1px solid #34415e;border-radius:10px;padding:14px;color:white;font-size:15px}
button{border:0;border-radius:10px;padding:13px 18px;background:#7185ff;color:#fff;font-weight:700;cursor:pointer}button:hover{opacity:.85}
#tasks{padding:0;list-style:none}.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #293451}.task:last-child{border:0}.task span{flex:1;overflow-wrap:anywhere}.task.done span{text-decoration:line-through;color:#7f8ba5}.task button{padding:8px 11px}.delete{background:#3b2538}.empty{color:#8996b2;padding:20px 0}
#message{min-height:20px;color:#ffb8b8;font-size:14px}.footer{font-size:12px;color:#7583a2;margin-top:20px}
</style>
</head>
<body>
<main>
<div class="tag">PERSONAL PRODUCTIVITY / LAB 01</div>
<h1>Task Manager<span style="color:#8190ff">.</span></h1>
<p>Small steps. Real progress.</p>
<section class="panel">
<form id="form"><input id="title" placeholder="What needs to get done?" maxlength="200" required><button>Add task +</button></form>
<div id="message"></div>
<ul id="tasks"></ul>
<div class="footer">Tasks are stored in PostgreSQL through your Flask API.</div>
</section>
</main>
<script>
const form=document.querySelector('#form'),title=document.querySelector('#title'),list=document.querySelector('#tasks'),message=document.querySelector('#message');
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok){const body=await r.json().catch(()=>({}));throw Error(body.error||`Request failed (${r.status})`)}return r.status===204?null:r.json()}
async function load(){try{const tasks=await api('/tasks');list.innerHTML='';if(!tasks.length){list.innerHTML='<li class="empty">No tasks yet. Add your first one above.</li>';return}for(const t of tasks){const li=document.createElement('li');li.className='task'+(t.completed?' done':'');const text=document.createElement('span');text.textContent=t.title;const done=document.createElement('button');done.textContent=t.completed?'Undo':'Done';done.onclick=async()=>{try{await api('/tasks/'+t.id,{method:'PATCH',body:JSON.stringify({completed:!t.completed})});await load()}catch(e){message.textContent=e.message}};const del=document.createElement('button');del.textContent='Delete';del.className='delete';del.onclick=async()=>{try{await api('/tasks/'+t.id,{method:'DELETE'});await load()}catch(e){message.textContent=e.message}};li.append(text,done,del);list.append(li)}}catch(e){message.textContent='Could not load tasks: '+e.message}}
form.onsubmit=async e=>{e.preventDefault();message.textContent='';try{await api('/tasks',{method:'POST',body:JSON.stringify({title:title.value.trim()})});title.value='';await load()}catch(err){message.textContent=err.message}};
load();
</script>
</body>
</html>
